[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nas-smb-cli"
version = "0.1.0"
description = "NAS SMB 文件管理 CLI（smbprotocol 实现），面向终端用户与 AI agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OstrichHermit" }]
keywords = ["nas", "smb", "samba", "cli", "file-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "smbprotocol>=1.10",
]

[project.urls]
Homepage = "https://github.com/OstrichHermit/nas-smb-cli"

[project.scripts]
nas = "nas_smb_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
